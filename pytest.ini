[pytest]
testpaths = data-engine/app/tests viewer/tests deploy/tests contracts/review-ingest/v1/tests contracts/knowledge-v3/v1/tests contracts/review-status/v1/tests tests/integration tests/e2e tests/wave2 tests/wave2b tests/test_docs_numbering.py
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# `critico` es el enganche MANUAL —y solo el enganche— de la deteccion de
# suites criticas de `.github/scripts/check_suite_inventory.py`. La deteccion
# principal se DERIVA de los arneses de calibracion que usan una suite como
# instrumento; este marcador existe para una suite que todavia no tiene
# calibrador y que aun asi no puede desaparecer ni silenciarse.
#
# Ponerlo no protege menos que derivarlo: protege igual. Lo que NO se hace es
# depender de el, porque una lista que hay que acordarse de rellenar es la
# clase de proteccion que fallo tres veces en este repositorio.
markers =
    critico: suite cuya desaparicion o silenciado tiene que poner CI en ROJO
