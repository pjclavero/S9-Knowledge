[pytest]
# Configuración PROPIA de la batería de navegador contra instalación real.
#
# Este directorio NO está en los `testpaths` del `pytest.ini` de la raíz ni lo
# invoca ningún job de `.github/workflows/ci.yml`: la CI normal no lo recoge y
# el inventario de suites (`.github/suite-inventario.json`) no lo contiene. Se
# ejecuta a mano, apuntando a este directorio, contra una instalación real
# (ver README.md). Al tener su propio fichero de configuración, pytest toma
# este directorio como raíz y no carga los `conftest.py` del producto.
python_files = test_nav_*.py
python_functions = test_*
addopts = -p no:cacheprovider -ra
markers =
    sin_grafo: la prueba NO necesita Neo4j
    necesita_grafo: la prueba necesita Neo4j arrancado (capacidad «grafo»)
    requiere(*capacidades): capacidades de la instalación que la prueba necesita además
    cubre(*ids): escenarios, pasos manuales y regresiones del contrato que la prueba cubre
