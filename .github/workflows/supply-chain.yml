name: Supply Chain Security

on:
  push:
    # Misma politica que `ci.yml`: toda rama, sin lista blanca que mantener.
    # Dejarla aqui como lista de prefijos reproduciria el mismo agujero
    # silencioso en el unico workflow que audita dependencias.
    branches: [ '**' ]
  pull_request:
    branches: [ main ]
  schedule:
    # Ejecucion semanal para detectar CVE nuevas sobre dependencias ya fijadas.
    - cron: '0 6 * * 1'

jobs:
  pip-audit:
    name: pip-audit (data-engine + viewer)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install pip-audit
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pip-audit

      # EXCEPCION GHSA-8mgp-746c-j5xp (nltk) CERRADA el 2026-11-16 por su CONDICION 1:
      # hay version corregida (nltk 3.10.4, que ademas corrige los 8 avisos nuevos del
      # 13-14 nov). El lock fija nltk==3.10.4; se retiran el `--ignore-vuln` y su
      # guardia de atadura a nltk==3.10.3. Historial: PR #203 y git log de este fichero.
      - name: Audit data-engine (requirements.lock)
        run: |
          set -euo pipefail
          pip-audit -r data-engine/requirements.lock

      - name: Audit viewer (requirements.txt)
        run: |
          set -euo pipefail
          pip-audit -r viewer/requirements.txt
