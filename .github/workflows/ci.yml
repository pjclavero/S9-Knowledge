name: CI

on:
  # TODA rama dispara CI. `**` casa con cualquier nombre de rama, con y sin
  # barras, asi que una familia nueva (`work/…`, `impl/…`, `integration/…` o la
  # que venga manana) tiene CI el dia que nace, SIN tocar este fichero.
  #
  # Por que se abandona la lista blanca de prefijos: este filtro es por rama de
  # ORIGEN y solo afecta a `push` (`pull_request.branches` filtra por rama
  # DESTINO, asi que un PR contra `main` siempre ejecuta CI). El agujero estaba
  # en `push`: una rama con prefijo no cubierto se desarrollaba entera sin
  # ninguna senal hasta abrir el PR. Se parcheo tres veces —`test/**`, luego
  # `ops/**` + `dependabot/**`, luego `perf/**`— y a la cuarta ya habia nueve
  # ramas nuevas descubiertas otra vez. Una lista que hay que mantener a mano
  # para no tener un agujero silencioso ES el agujero: `**` lo cierra por
  # construccion en vez de por vigilancia.
  #
  # `check-ci-config` ya no vigila prefijos uno a uno: comprueba la PROPIEDAD
  # (que cualquier nombre de rama, real o inventado, quede cubierto), asi que
  # volver a una lista blanca —aunque sea larga— pone el gate en rojo. Ademas
  # rechaza `paths`/`paths-ignore`/`branches-ignore` bajo `on.push`, que podrian
  # apagar CI sin tocar `branches`. Vigila `ci.yml` y `supply-chain.yml`.
  #
  # Solo ramas: NO se anade `tags`, que dispararia CI en cada etiqueta.
  push:
    branches:
      - '**'
  pull_request:
    branches: [ main ]

jobs:
  test-data-engine:
    name: Data Engine Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'data-engine/requirements.lock'

      - name: Install data-engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r data-engine/requirements.lock

      - name: Run data engine tests
        env:
          S9K_ALLOW_REAL_INGEST: ""
        run: |
          # Guardia anti-cero: un pytest que colecciona 0 tests (directorio
          # renombrado, filtro que no casa) saldria en verde sin comprobar
          # nada. `check-ci-config` exige esta guardia en todo paso que
          # invoque pytest.
          set +e
          out="$(python -m pytest data-engine/app/tests/ -v --tb=short --no-header 2>&1)"
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -eq 0 ] || exit 1
          if ! grep -qE '[0-9]+ passed' <<<"$out"; then
            echo "::error::no se ejecuto ninguna prueba de data-engine"
            exit 1
          fi

  test-viewer:
    name: Viewer Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'viewer/requirements.txt'

      - name: Install viewer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r viewer/requirements.txt

      - name: Run viewer tests
        env:
          S9K_ALLOW_REAL_INGEST: ""
        run: |
          # Guardia anti-cero (ver `check-ci-config`).
          set +e
          out="$(python -m pytest viewer/tests/ -v --tb=short --no-header 2>&1)"
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -eq 0 ] || exit 1
          if ! grep -qE '[0-9]+ passed' <<<"$out"; then
            echo "::error::no se ejecuto ninguna prueba del visor"
            exit 1
          fi

  test-neo4j-authz:
    name: Authz integration (Neo4j efímero)
    runs-on: ubuntu-latest
    # Cubre la frontera Neo4j -> serializador -> política, que no cubría nada:
    # con 675 pruebas verdes, `partida_id` se perdía al proyectar y el
    # aislamiento entre partidas no llegaba a evaluarse sobre datos reales.
    services:
      neo4j:
        image: neo4j:5.26.0
        env:
          NEO4J_AUTH: neo4j/testtesttest
          NEO4J_server_memory_pagecache_size: 128M
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testtesttest 'RETURN 1'"
          --health-interval 10s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'viewer/requirements.txt'

      - name: Install viewer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r viewer/requirements.txt

      - name: Run authz integration tests
        env:
          NEO4J_TEST_URI: bolt://localhost:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: testtesttest
        run: |
          # Estas pruebas NO pueden omitirse en silencio: si no hay base, se
          # saltan solas, y un skip verde aqui equivale a no tener la prueba.
          # `bash -e` aborta el paso en cuanto la asignacion recoge un pytest
          # que ha fallado, y entonces NUNCA se llega al `echo "$out"`: el paso
          # sale en rojo sin mostrar que test fallo ni por que. Un guard que
          # esconde el fallo que deberia explicar es peor que no tenerlo, asi
          # que aqui se captura el codigo aparte y siempre se imprime la salida.
          set +e
          # Dos ficheros, UNA invocacion: los tres guardas de abajo miran la
          # salida COMBINADA, asi que cubren los dos sin duplicar logica. Si el
          # contrato de paneles se saltara (contenedor caido, variables sin
          # definir), el `grep skipped` lo caza igual que al primero -- que es
          # justo lo que hoy NO pasa: en `test-viewer` estas 43 pruebas salen
          # SKIPPED y el job sale verde (medido en la ejecucion 31916319923).
          out="$(python -m pytest viewer/tests/test_neo4j_integration_authz.py \
                                  viewer/tests/test_contrato_paneles_neo4j.py \
                                  -v --no-header 2>&1)"
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::la suite de integracion contra Neo4j ha FALLADO"
            exit 1
          fi
          if echo "$out" | grep -qi "skipped"; then
            echo "::error::la suite de integracion se ha OMITIDO; no hay Neo4j efimero"
            exit 1
          fi
          if ! echo "$out" | grep -qE '[0-9]+ passed'; then
            echo "::error::la suite de integracion no llego a ejecutar ninguna prueba"
            exit 1
          fi

      - name: Calibracion de IDENTIDAD DURABLE (cada defecto tiene que enrojecer)
        env:
          NEO4J_TEST_URI: bolt://localhost:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: testtesttest
        run: |
          # Los filtros de identidad durable del proveedor SOLO se pueden
          # ejercer contra una base real: sin Neo4j, el arnes los declara y no
          # los mide, y un control declarado no es un control. Aqui, con la
          # base efimera del propio job, se REINTRODUCE cada defecto uno a uno
          # y se exige que la suite lo detecte.
          #
          # Va en ESTE job, como un paso mas, a proposito: un job nuevo seria
          # un check requerido nuevo, y esta medida es parte del mismo contrato
          # que las pruebas de arriba, no una puerta aparte.
          #
          # El arnes MUTA `viewer/app/providers/neo4j_provider.py` y lo revierte
          # verificando SHA-256. Por eso este paso va DESPUES de la suite y no
          # se paraleliza con nada que lea ese fichero.
          set +e
          out="$(python3 artifacts/identidad-durable/calibrar.py 2>&1)"
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::la calibracion de identidad durable ha FALLADO"
            exit 1
          fi
          # Un arnes que no ejerce nada saldria con rc=0 y estaria mintiendo.
          if ! echo "$out" | grep -qE 'veredicto=CALIBRADO'; then
            echo "::error::la calibracion no emitio veredicto CALIBRADO"
            exit 1
          fi
          # SUELO, no ausencia. La version anterior de esta guarda buscaba
          # `declaradas_sin_ejercer=[1-9]`, es decir, comprobaba que ALGO no
          # aparece: una salida `ejercidas=0 ... declaradas_sin_ejercer=0
          # veredicto=CALIBRADO` la pasaba entera, y un renombrado del campo la
          # dejaba sin vigilar EN SILENCIO. Ahora se EXTRAEN los tres numeros:
          # si el campo desaparece o cambia de nombre, la extraccion sale vacia
          # y el paso se pone rojo por eso mismo.
          ejercidas="$(echo "$out" | grep -oE 'ejercidas=[0-9]+' | head -1 | cut -d= -f2)"
          enrojecidas="$(echo "$out" | grep -oE 'enrojecidas=[0-9]+' | head -1 | cut -d= -f2)"
          declaradas="$(echo "$out" | grep -oE 'declaradas_sin_ejercer=[0-9]+' | head -1 | cut -d= -f2)"
          echo "ejercidas=$ejercidas enrojecidas=$enrojecidas declaradas=$declaradas"
          if [ -z "$ejercidas" ] || [ -z "$enrojecidas" ] || [ -z "$declaradas" ]; then
            echo "::error::el RESUMEN no trae ejercidas/enrojecidas/declaradas_sin_ejercer: el arnes ha cambiado de formato y esta guarda ya no vigila nada"
            exit 1
          fi
          # Con la base efimera del job, las DIECISEIS tienen que ejercerse.
          # (12 de identidad durable + 4 de UNICIDAD DURABLE: MU1 quita el
          # fail-closed de `entity()`; MU2 el de `relations_for_entity()`;
          # MU3 ENSANCHA la clave del esquema con `partida_id`, con lo que
          # Neo4j deja de aplicarla a la capa juego --que no tiene esa
          # propiedad-- y la restriccion sigue ahi sin proteger el lore;
          # MU4 hace lo mismo con la de aserciones. MU3/MU4 son ablaciones de
          # CAPACIDAD: la version anterior de MU3 estrechaba la clave, que es
          # anclar la FORMA, no demostrar que la barrera defiende algo.)
          if [ "$ejercidas" -lt 16 ]; then
            echo "::error::solo se ejercieron $ejercidas mutaciones (con Neo4j tienen que ser 16): arnes mudo"
            exit 1
          fi
          if [ "$enrojecidas" -ne "$ejercidas" ]; then
            echo "::error::$enrojecidas de $ejercidas mutaciones enrojecieron"
            exit 1
          fi
          if [ "$declaradas" -ne 0 ]; then
            echo "::error::con Neo4j disponible NINGUNA mutacion puede quedar sin ejercer"
            exit 1
          fi

  test-login-browser:
    name: Login browser contract (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r viewer/requirements.txt playwright uvicorn
          # --with-deps instala las librerias del sistema que el navegador
          # necesita; sin ellas chromium arranca y muere al instante.
          python -m playwright install --with-deps chromium

      - name: Chromium tiene que estar (fallo ruidoso, jamas un skip)
        run: |
          # `pip install playwright` NO implica que el navegador este
          # descargado, y esa diferencia es exactamente la que hizo que las 171
          # pruebas de viewer/tests/browser se omitieran en verde. Aqui se
          # comprueba el BINARIO que Playwright lanzaria, antes de que pytest
          # tenga ocasion de omitir nada.
          set -euo pipefail
          python3 .github/scripts/check_env_reproducibility.py runtimes --require chromium

      - name: Run browser contract tests
        run: |
          set -euo pipefail
          cd viewer
          # El contrato (escribir = 0 POST, Enter completo = 1 POST) solo se
          # puede comprobar en un navegador de verdad. Aqui el navegador ESTA,
          # asi que saltarse los tests seria un verde que no prueba nada.
          out="$(python -m pytest tests/browser -q --no-header 2>&1)" || {
            echo "${out}"; exit 1;
          }
          echo "${out}"
          if ! grep -qE '[0-9]+ passed' <<<"${out}"; then
            echo "ERROR: los tests de navegador no llegaron a ejecutarse"
            exit 1
          fi
          if grep -qE '[0-9]+ skipped' <<<"${out}"; then
            echo "ERROR: se saltaron tests de navegador con el navegador disponible"
            exit 1
          fi

  test-combined:
    name: Combined Test Suite (no collection errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r data-engine/requirements.lock
          pip install -r viewer/requirements.txt

      - name: Run combined test suite
        env:
          S9K_ALLOW_REAL_INGEST: ""
        run: |
          # Guardia anti-cero (ver `check-ci-config`).
          set +e
          mkdir -p artifacts/junit
          out="$(python -m pytest --tb=short --no-header -q --junitxml=artifacts/junit/combined.xml 2>&1)"
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -eq 0 ] || exit 1
          if ! grep -qE '[0-9]+ passed' <<<"$out"; then
            echo "::error::la suite combinada no ejecuto ninguna prueba"
            exit 1
          fi

      # -----------------------------------------------------------------
      # VERIFICAR EL RESULTADO, NO LA CAUSA
      # -----------------------------------------------------------------
      # `N passed` dice que se ejecuto ALGO. El paso anterior lo comprueba y no
      # basta: un revisor independiente apago suites criticas UNA RONDA TRAS
      # OTRA con vias nuevas cada vez (`PYTEST_ADDOPTS` por cinco niveles de
      # `env:`, por `$GITHUB_ENV`, con el nombre concatenado sin `$`, por
      # `container.options -e`, por un `uses:` a nivel de job, por un
      # `sitecustomize.py`), y en cada ronda el gate cerraba la via encontrada.
      # La superficie de CAUSAS es abierta; el RESULTADO no.
      #
      # Este paso compara, modulo a modulo, lo que el job EJECUTO DE VERDAD
      # —el informe `--junitxml`— contra `.github/suite-inventario.json`. Si
      # `test_parcialidad_declarada.py` no reporta sus pruebas aqui, ROJO, sin
      # importar por que. Es la misma logica que `test-neo4j-authz` ya usa con
      # `grep -qi skipped`, generalizada.
      #
      # NO sustituye a los nueve SUP de `check_suite_inventory.py`: se SUMA.
      # Aquella capa mira la causa y avisa antes; esta mira el efecto y no se
      # puede rodear.
      #
      # Vive en ESTE job y no en uno nuevo por lo mismo que el inventario: un
      # job nuevo cambiaria el recuento de checks requeridos, y eso es decision
      # del operador. Ademas este es el unico job con TODAS las dependencias
      # instaladas, que es lo que hace honesta la comparacion: el inventario se
      # midio en este mismo entorno.
      - name: Lo ejecutado de verdad tiene que ser lo que el inventario declara
        run: |
          set -euo pipefail
          python3 .github/scripts/check_ejecucion_real.py \
            --junit artifacts/junit

      # -----------------------------------------------------------------
      # Inventario de suites como PUERTA (ejercicio RC 1)
      # -----------------------------------------------------------------
      # `N passed` comprueba que se ejecuto ALGO, jamas que se ejecuto LO QUE
      # TENIA QUE EJECUTARSE. Un revisor adversarial lo demostro VIVO: puso
      # `pytestmark = skip` en `test_parcialidad_declarada.py`, en
      # `test_identidad_durable.py` y en `test_chassis_mount_contract.py`, uno
      # por uno, y este job siguio VERDE (1554 / 1565 / 1488 passed). Y sin
      # PyYAML, 293 -> 215 passed sin que nada avisara.
      #
      # Este paso vive AQUI y no en un job propio a proposito: un job nuevo
      # cambiaria el recuento de checks requeridos (hoy 16 del proyecto) y eso
      # es decision del operador, no efecto colateral de un carril. Ademas este
      # es el unico job con TODAS las dependencias instaladas y con
      # `fetch-depth: 0`, que es lo que el trinquete necesita para leer el
      # inventario del merge-base.
      #
      # La lista de suites obligatorias NO se escribe aqui ni en ningun sitio:
      # se DERIVA de lo que los jobs invocan, de la coleccion real, de los
      # arneses de calibracion y del inventario de la base. Ver la cabecera de
      # `.github/scripts/check_suite_inventory.py`.
      - name: Ninguna suite critica puede desaparecer ni silenciarse
        env:
          S9K_ALLOW_REAL_INGEST: ""
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 .github/scripts/check_suite_inventory.py

      # El inventario es una MEDIDA, no una lista: se regenera. Si el commit no
      # trae el inventario actualizado, la base del trinquete del PR siguiente
      # seria la de antes y el trinquete afloja solo.
      - name: El inventario publicado tiene que estar al dia
        env:
          S9K_ALLOW_REAL_INGEST: ""
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 .github/scripts/check_suite_inventory.py --escribir-inventario >/dev/null
          if ! git diff --quiet -- .github/suite-inventario.json; then
            echo "::error::.github/suite-inventario.json esta desactualizado."
            echo "Regeneralo:  python3 .github/scripts/check_suite_inventory.py --escribir-inventario"
            git --no-pager diff --stat -- .github/suite-inventario.json
            exit 1
          fi
          echo "OK: el inventario publicado coincide con la medida"

  review-ingest-contracts:
    name: Contratos review/ingest v1 (JSON Schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install JSON Schema tooling
        run: |
          # Sin `|| true`: si falta jsonschema el gate falla, no pasa en verde.
          set -euo pipefail
          python -m pip install --upgrade pip
          # `referencing` se IMPORTA con `importorskip` en los tests de
          # contratos. Hasta ahora llegaba solo como dependencia transitiva de
          # `jsonschema`: el dia que jsonschema cambie de rango, esas pruebas se
          # convierten en skips VERDES y nadie se entera. Lo detecto
          # el preflight de `check_suite_inventory.py` y se declara explicito.
          pip install "jsonschema>=4.18,<5.0" "referencing>=0.36,<1.0" "pytest>=8.2,<9.0"
          python -c "import jsonschema, referencing; print('jsonschema', jsonschema.__version__)"

      - name: Validate contracts (schemas + examples + semantics)
        run: |
          # Guardia anti-cero (ver `check-ci-config`).
          set +e
          out="$(python -m pytest contracts/review-ingest/v1/tests/ -q --no-header 2>&1)"
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -eq 0 ] || exit 1
          if ! grep -qE '[0-9]+ passed' <<<"$out"; then
            echo "::error::los tests de contratos review/ingest no se ejecutaron"
            exit 1
          fi

  knowledge-v3-contracts:
    name: Contratos internos V3 (v3-internal-v1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install JSON Schema tooling
        run: |
          # Sin `|| true`: si falta jsonschema el gate falla, no pasa en verde.
          set -euo pipefail
          python -m pip install --upgrade pip
          # `referencing` se IMPORTA con `importorskip` en los tests de
          # contratos. Hasta ahora llegaba solo como dependencia transitiva de
          # `jsonschema`: el dia que jsonschema cambie de rango, esas pruebas se
          # convierten en skips VERDES y nadie se entera. Lo detecto
          # el preflight de `check_suite_inventory.py` y se declara explicito.
          pip install "jsonschema>=4.18,<5.0" "referencing>=0.36,<1.0" "pytest>=8.2,<9.0"
          python -c "import jsonschema, referencing; print('jsonschema ok')"

      - name: Validate V3 contracts (roundtrip + mutacion)
        run: |
          set -euo pipefail
          out="$(python -m pytest contracts/knowledge-v3/v1/tests/ -q --no-header 2>&1)" || {
            echo "${out}"; exit 1;
          }
          echo "${out}"
          # Un gate que no ejecuta nada seria un verde que no comprueba nada.
          if ! grep -qE '[0-9]+ passed' <<<"${out}"; then
            echo "ERROR: los tests de contratos V3 no llegaron a ejecutarse"
            exit 1
          fi

      - name: Los ejemplos coinciden con las fixtures (no hay deriva)
        run: |
          set -euo pipefail
          python contracts/knowledge-v3/v1/tests/generate_examples.py
          # `git diff` NO ve ficheros nuevos sin rastrear: un ejemplo anadido a
          # las fixtures y no commiteado pasaba este gate en verde. Hay que
          # mirar tambien el estado con --porcelain, que si los lista.
          if ! git diff --quiet -- contracts/knowledge-v3/v1/examples; then
            echo "ERROR: los ejemplos en disco no coinciden con las fixtures"
            git --no-pager diff --stat -- contracts/knowledge-v3/v1/examples
            exit 1
          fi
          untracked="$(git status --porcelain -- contracts/knowledge-v3/v1/examples)"
          if [ -n "${untracked}" ]; then
            echo "ERROR: ejemplos generados que no estan en el repositorio:"
            echo "${untracked}"
            exit 1
          fi
          echo "OK: ejemplos sincronizados (modificados y sin rastrear)"

  check-ci-config:
    name: Integridad de gates (cobertura de ramas, 0 tests, skips criticos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install PyYAML
        run: |
          # El gate parsea los workflows con `yaml.safe_load`, no con regex:
          # una regex de texto se saltaba con una comilla o un espacio antes de
          # los dos puntos. Sin `|| true`: si falta PyYAML el gate falla.
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pyyaml
          python -c "import yaml; print('pyyaml', yaml.__version__)"

      - name: Ninguna rama sin CI, ningun job con 0 tests, ningun skip critico
        run: python3 .github/scripts/check_ci_config.py

  calibracion-de-gates:
    # Un gate que nunca se ha visto ROJO no es un gate, y una calibracion que
    # no se ejecuta se pudre igual que cualquier otro codigo muerto: el dia que
    # alguien afloje `check_ci_config.py`, el unico aviso seria este job.
    # Introduce cada violacion de VERDAD sobre el arbol de trabajo, comprueba
    # que el gate se pone rojo, y restaura.
    name: Calibracion de gates (cada violacion tiene que ponerse ROJA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install PyYAML
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: El gate se pone ROJO ante cada violacion y VERDE al restaurar
        run: python3 .github/scripts/calibra_gate_integrity.py

      # Carril J. Mismo principio, otra familia de gates: los del modelo de
      # autorizacion derivado del registro M5b y los del vocabulario canonico
      # de `review_status`. Vivia en la raiz del repositorio, donde hay
      # precedente (`mutaciones.py`) pero donde NINGUN job lo ejecutaba: una
      # calibracion que nadie corre se pudre, y entonces deja de ser una
      # propiedad del arbol para ser la foto de un dia.
      - name: Install deps para la calibracion del carril J
        run: |
          set -euo pipefail
          pip install -r data-engine/requirements.lock
          pip install -r viewer/requirements.txt

      - name: Calibracion de calidad de datos (carril J)
        env:
          S9K_ALLOW_REAL_INGEST: ""
        run: python3 scripts/calibracion/mutaciones_calidad_datos.py

      # Mismo principio, tercer gate: el inventario de suites. Introduce de
      # VERDAD cada ataque del ejercicio RC —silenciar los tres ficheros,
      # borrarlos, tumbar el recuento, quitar `jsonschema` y `PyYAML`—, exige
      # el ROJO, y ADEMAS hace la ablacion de cada control: con el control
      # quitado el caso tiene que volver a VERDE. Un control que puede
      # desaparecer sin que ningun resultado empeore no es un control.
      #
      # La reversion se verifica por SHA-256 de cada fichero tocado, no por la
      # ausencia de una cadena.
      - name: El inventario de suites se pone ROJO ante cada ataque (y ablacion)
        env:
          S9K_ALLOW_REAL_INGEST: ""
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 .github/scripts/calibra_suite_inventory.py

      # Y la calibracion de la capa que mira el RESULTADO. Apaga la suite del
      # visor por cada vector CONOCIDO —incluidos los tres que un revisor
      # independiente encontro despues de que el reconocedor los diera por
      # cerrados: nombre concatenado sin `$` hacia `$GITHUB_ENV` (G1),
      # `container.options -e` (G2) y `uses:` a nivel de job (G3)— y exige que
      # el informe `--junitxml` lo delate. Cada caso apaga un MODULO DISTINTO,
      # asi que ningun rojo es prestado. Con la ablacion puesta, esos mismos
      # casos vuelven a VERDE.
      #
      # No muta ningun fichero del repositorio: los artefactos van a un
      # directorio temporal. Publica igualmente el SHA-256 antes y despues,
      # porque "no lo toco" tambien hay que medirlo.
      - name: La capa de ejecucion real se pone ROJA ante cada vector (y ablacion)
        env:
          S9K_ALLOW_REAL_INGEST: ""
        run: python3 .github/scripts/calibra_ejecucion_real.py

  # Instalado desde .github/ci-fragments/check-env-reproducibility.yml. Si un
  # merge se lleva por delante este bloque, el fragmento es la copia canonica.
  check-env-reproducibility:
    name: Reproducibilidad de entorno (declarado == instalado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install declared dependencies
        run: |
          # Exactamente lo que instalan los jobs de test, en el mismo orden que
          # el job combinado: lo que se audita es EL entorno de CI, no otro.
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r data-engine/requirements.lock
          pip install -r viewer/requirements.txt

      - name: El gate se calibra a si mismo (violacion -> rojo -> reversion)
        run: |
          # Un gate cuyo mecanismo de medida no se prueba puede pasar meses sin
          # poder ponerse rojo y nadie lo notaria. Esto inyecta cada violacion
          # sobre repositorios sinteticos y exige el rojo, antes de creerse el
          # verde del paso siguiente.
          set -euo pipefail
          python3 .github/scripts/check_env_reproducibility_calibration.py

      - name: Lo declarado tiene que ser lo instalado
        run: |
          # --strict-missing: aqui las dependencias YA estan instaladas, asi que
          # una declarada y ausente es un fallo, no un aviso.
          set -euo pipefail
          python3 .github/scripts/check_env_reproducibility.py all --strict-missing

  # Instalado desde .github/ci-fragments/test-graph-js.yml al llegar
  # viewer/tests/test_graph_ux_v2.py con esta rama. Sin este job, ese fichero
  # solo corre en `test-viewer`, que NO tiene Node: las ~38 aserciones de la
  # especificacion JS se omitian en silencio y el job requerido pasaba igual.
  # `check-ci-config` falla si alguien lo quita.
  test-graph-js:
    name: Especificacion JS del grafo (Node obligatorio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'viewer/requirements.txt'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Node tiene que estar
        run: |
          # Sin `|| true`: si no hay Node, el gate falla aqui y se ve, en vez
          # de degradarse a un skip verde mas abajo.
          set -euo pipefail
          node --version
          # El gate lee la version DECLARADA parseando `ci.yml`, no con una
          # regex de texto (un `# node-version: 18` comentado contaba como
          # declaracion y lo ponia rojo por nada). Por eso necesita PyYAML, y
          # si falta se pone ROJO en vez de degradar a solo-presencia.
          pip install pyyaml
          # Y la misma comprobacion por el camino comun a todos los runtimes,
          # que es el que `check-env-reproducibility` exige que exista: la
          # ausencia sale por `::error::`, nunca como skip.
          python3 .github/scripts/check_env_reproducibility.py runtimes --require node

      - name: Install viewer dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r viewer/requirements.txt

      - name: Run graph UX spec (sin skips permitidos)
        run: |
          # `bash -e` aborta el paso en cuanto la asignacion recoge un pytest
          # fallido y NUNCA se llega al `echo`: el paso sale en rojo sin decir
          # que fallo. Se captura el codigo aparte y SIEMPRE se imprime.
          cd viewer
          set +e
          out="$(python -m pytest tests/test_graph_ux_v2.py -v --no-header 2>&1)"
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::la especificacion del grafo ha FALLADO"
            exit 1
          fi
          # Con Node disponible, un skip es una prueba que no existe.
          if echo "$out" | grep -qi "skipped"; then
            echo "::error::se han OMITIDO pruebas con Node disponible"
            exit 1
          fi
          if ! echo "$out" | grep -qE '[0-9]+ passed'; then
            echo "::error::la especificacion no llego a ejecutar ninguna prueba"
            exit 1
          fi

  check-unicode:
    name: No dangerous Unicode (Trojan Source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Check for dangerous Unicode characters
        run: python3 .github/scripts/check_unicode.py

  check-imports:
    name: No hardcoded absolute paths in sys.path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for sys.path manipulation with hardcoded /opt paths
        run: |
          # Only catches actual sys.path.insert/append with /opt/ paths.
          # String literals used as configurable CLI defaults are intentional and excluded.
          if grep -rPn "sys\.path\.(insert|append)\s*\(.*['\"]\/opt" \
               --include="*.py" . 2>/dev/null; then
            echo "ERROR: sys.path manipulation with hardcoded /opt paths found"
            echo "Fix: use Path(__file__).parent to resolve paths relative to the script"
            exit 1
          fi
          echo "OK: no sys.path manipulation with hardcoded /opt paths found"

  deployment-validation:
    name: Deployment scripts validation
    runs-on: ubuntu-latest
    # Este job se quedo 18 min colgado en `Install validation tools` (apt-get +
    # pip) en sus dos ejecuciones, cuando su marca normal es ~57 s. Sin tope,
    # un cuelgue de infraestructura no se distingue de un job lento: se queda
    # PENDIENTE, y un check que nunca concluye no bloquea ni aprueba, solo
    # consume la paciencia de quien mira. Con tope se convierte en ROJO rapido,
    # que es una senal, y relanzarlo es una decision consciente.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install validation tools
        run: |
          # Sin `|| true`: si la instalacion falla hay que enterarse aqui, no
          # descubrir mas tarde que el gate paso en verde sin comprobar nada.
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          pip install yamllint ansible ansible-lint --quiet

      - name: bash syntax check
        run: |
          echo "=== bash -n ==="
          bash -n deploy/scripts/*.sh deploy/tests/*.sh
          echo "OK: todos los scripts pasan bash -n"

      # En CI la herramienta DEBE estar: si falta, el gate no se omite, falla.
      # Saltarselo en silencio convertia este job en un verde que no comprobaba
      # nada. En local, validate.sh sigue reportando SKIP (nunca PASS).
      - name: shellcheck
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null || {
            echo "ERROR: shellcheck no instalado; el gate obligatorio no puede omitirse en CI"
            exit 1
          }
          shellcheck -x -e SC1091 deploy/scripts/*.sh
          echo "OK: shellcheck"

      - name: yamllint
        run: |
          set -euo pipefail
          command -v yamllint >/dev/null || {
            echo "ERROR: yamllint no instalado; el gate obligatorio no puede omitirse en CI"
            exit 1
          }
          yamllint -d relaxed deploy/ansible/
          echo "OK: yamllint"

      - name: ansible syntax-check
        run: |
          set -euo pipefail
          command -v ansible-playbook >/dev/null || {
            echo "ERROR: ansible-playbook no instalado; el gate obligatorio no puede omitirse en CI"
            exit 1
          }
          cd deploy/ansible
          ansible-playbook site.yml --syntax-check -i inventory.example
          echo "OK: ansible syntax-check"

      - name: validate.sh
        run: bash deploy/tests/validate.sh

      - name: Unicode check
        run: python3 .github/scripts/check_unicode.py

      - name: docs consistency
        run: |
          set -euo pipefail
          pip install pyyaml --quiet
          python3 scripts/check_docs_consistency.py

      - name: No secrets in deploy scripts
        run: |
          echo "=== no secretos hardcodeados ==="
          if grep -rEn "(password|passwd|token|secret|api_key)\s*=\s*['\"][^'\"]{6,}['\"]" \
               deploy/ --include="*.sh" --include="*.yml" --include="*.yaml" \
               | grep -v '^\s*#' | grep -v 'example\|plantilla\|AVISO\|WARN'; then
            echo "ERROR: POSIBLES SECRETOS HARDCODEADOS DETECTADOS"
            exit 1
          fi
          echo "OK: sin secretos detectados"

  # ---------------------------------------------------------------------------
  # Censo de rutas como PUERTA (docs/68 5.quater, docs/83)
  # ---------------------------------------------------------------------------
  # La configuracion que dice que rutas y routers deben existir NO es una lista
  # documental: se deriva del codigo que la propia app ejecuta (routers
  # descubiertos en `viewer/app/**`, `app.chassis.NAV`, `app.chassis.FEATURE_SLOTS`
  # y los interruptores del chasis). Ver la cabecera de `scripts/route_map/gate.py`.
  #
  # NINGUNA `S9K_PANEL_*_ENABLED` se exporta aqui, y eso NO se confia: la puerta
  # COMPRUEBA el entorno y sale roja si encuentra alguna encendida. Una puerta que
  # mide una app y certifica otra nace con el defecto que dice cerrar.
  route-map-gate:
    name: Censo de rutas (configuracion canonica en codigo)
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` NO es decorativo: G17 comprueba que el conjunto de
      # hallazgos DUROS no ha encogido respecto a la base, y para eso necesita
      # leer `gate.py` en el merge-base con `origin/main`. Con el checkout
      # superficial por defecto no hay historia con la que comparar y G17 se
      # pone ROJO en vez de callarse.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: La base de comparacion tiene que existir (G17)
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          base="$(git merge-base HEAD origin/main)"
          echo "merge-base con origin/main: $base"
          test -n "$base"

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'viewer/requirements.txt'

      - name: Install viewer dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r viewer/requirements.txt

      # `tested` no es "el nombre de la ruta sale en un test": es "una peticion
      # atraveso el objeto Route de la app real". Sin esto el censo da rc=3.
      - name: La sonda es obligatoria (genera --tested atravesando la app real)
        env:
          PYTHONPATH: scripts:viewer
          PYTHONDONTWRITEBYTECODE: '1'
          S9K_ROUTE_PROBE_OUT: artifacts/route-map/ci-tested_routes.json
          S9K_ALLOW_REAL_INGEST: ""
        run: |
          # Guardia anti-cero (ver `check-ci-config`): un arnes que pasa con 0
          # casos esta roto, y aqui ademas dejaria el censo sin cobertura.
          set +e
          out="$(python -m pytest viewer/tests/ -q --no-header -p route_map.pytest_route_probe 2>&1)"
          rc=$?
          set -e
          echo "$out" | tail -30
          [ "$rc" -eq 0 ] || exit 1
          if ! grep -qE '[0-9]+ passed' <<<"$out"; then
            echo "::error::no se ejecuto ninguna prueba: sin sonda no hay censo"
            exit 1
          fi

      - name: Censo + puerta (el codigo de salida del censo se pasa a la puerta)
        env:
          PYTHONPATH: scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -uo pipefail
          mkdir -p artifacts/route-map
          set +e
          python3 scripts/route_map/route_map.py --repo . \
            --tested artifacts/route-map/ci-tested_routes.json \
            --out artifacts/route-map/ci-route_map.json \
            --md  artifacts/route-map/ci-route_map.md
          mapa_rc=$?
          set -e
          echo "route_map rc=$mapa_rc"
          # El rc del censo NO se descarta ni se asume 0: se le entrega a la
          # puerta, que lo convierte en `censo-en-rojo`. Un censo que salio en
          # rojo no puede certificar nada aunque el artefacto exista.
          python3 scripts/route_map/gate.py --repo . \
            --map artifacts/route-map/ci-route_map.json \
            --map-rc "$mapa_rc" \
            --out artifacts/route-map/ci-gate.json

      - name: La puerta se pone ROJA en cada punto del contrato (y VERDE al revertir)
        env:
          PYTHONPATH: scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          # `--mapa-completo` es la medida de referencia CON sonda que necesita
          # G15 para DERIVAR que hallazgos tienen que ser duros. Se reutiliza el
          # artefacto del paso anterior en vez de repetir los ~60 s de sonda.
          #
          # OJO, porque este comentario decia lo contrario y era FALSO: si la
          # bandera faltara, esto NO se pondria rojo. La referencia se generaria
          # sola, tardando mas. Es un atajo de tiempo, no una condicion de
          # validez, y quitarla de aqui no lo delata nada. Lo que si es rojo es
          # apuntar a un artefacto INVALIDO (tomado con `--skip-probe`, o sin
          # `--tested`): derivar sobre una medida falseada es peor que no derivar.
          python3 scripts/route_map/calibrate_gate.py \
            --mapa-completo artifacts/route-map/ci-route_map.json \
            --out artifacts/route-map/ci-calibracion-gate.json

      - name: Publicar artefactos del censo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-map-gate
          path: artifacts/route-map/ci-*
          if-no-files-found: warn
