# project-status.yaml — estado estructurado de S9 Knowledge (fuente de coherencia)
#
# Fuente de verdad: main + tags + PRs mergeados + CI de GitHub Actions para el
# bloque `development`; manifest de la release activa + estado verificado por
# SSH en VM105 para el bloque `production`. NO contiene secretos, IP privadas
# innecesarias, tokens ni hashes. Es la referencia para
# scripts/check_docs_consistency.py.
#
# El repositorio (`main`) y la producción desplegada (VM105) van
# DESACOPLADOS desde el merge de V3 (PR #110, 2026-07-29): `main` puede
# avanzar sin que VM105 cambie. Los tres bloques de abajo lo hacen explícito;
# no los mezcles al leer o escribir aquí.
#
# Actualizado tras el cierre del carril A (Graph UX V2, PR #158) y del disparo
# de CI en toda rama (PR #160) — 2026-08-11.
#
# `main_commit` y `latest_merged_pr` NO se escriben de memoria:
# scripts/check_docs_consistency.py los contrasta contra `origin/main` y falla
# si divergen. Editarlos a mano y equivocarse pone el gate en rojo.
#
# CONVENCIÓN DE PROCEDENCIA. Cada dato de `production` declara cómo se sabe:
#   VERIFIED             — leído directamente en el destino, con fecha.
#   PENDING_VERIFICATION — conocido en el pasado y NO releído desde entonces.
# Un dato PENDING_VERIFICATION no es falso ni verdadero: es NO COMPROBADO, y
# ningún documento debe citarlo como estado actual. El recuerdo de una
# conversación no es verificación.

development:
  # Lo que hay en `main` ahora mismo. NO implica que esté desplegado.
  main_commit: "cb874fe1141e4a17008c362c0aa404a90889128d"
  latest_merged_pr: 163  # ojo: el #158 se fusionó DESPUÉS que el #160 — el último NO es el de número mayor
  latest_ci: "green"  # CI en cb874fe: 14/14 jobs conclusion=success, más Supply Chain Security (leído con `gh run view`, 2026-08-11)

  # Cuántos jobs CORREN frente a cuántos BLOQUEAN un merge. La diferencia se
  # escribe a propósito: un job que corre pero no se exige no impide fusionar
  # en rojo. Es un informe, no una puerta. Ver RK-20.
  ci_jobs_running: 14
  ci_checks_required: 11   # leído de la protección de rama con `gh api`, no de un documento
  ci_running_but_not_required:
    - "Especificacion JS del grafo (Node obligatorio)"
    - "Integridad de gates (cobertura de ramas, 0 tests, skips criticos)"
    - "Calibracion de gates (cada violacion tiene que ponerse ROJA)"

  # Cuántos merges puede ir por detrás este bloque antes de que el gate lo
  # considere una mentira. NO es cero a propósito: exigir igualdad con la punta
  # de `main` dejaría el gate en rojo permanente en `main` —cada merge lo
  # rompería— y un rojo permanente no se lee, se ignora. Lo que el gate exige
  # siempre, sin tolerancia, es que el commit sea REAL y esté en la historia de
  # `main`: eso es lo que mata al SHA inventado. Esto solo acota el desfase.
  #
  # AVISO PROGRAMADO (medido el 2026-08-12, no estimado): el desfase de
  # `main_commit` respecto a `origin/main` es de **2** commits (#164 y #165),
  # con la ventana en 3. **El próximo merge a `main` pondrá este gate ROJO
  # automáticamente**, y ese rojo NO es una regresión del validador: es
  # exactamente lo que este campo existe para decir. El arreglo es de una
  # línea —remedir `main_commit`/`latest_merged_pr` contra `origin/main` y
  # actualizar los documentos que los citan—, nunca subir la ventana para
  # apagar el aviso. Se deja dicho aquí para que a nadie le pille por
  # sorpresa: `git rev-list --count <main_commit>..origin/main`.
  max_lag_commits: 3
  active_engine: "knowledge_v3"  # mergeado en main desde PR #110 (2026-07-29); sustituye a v1/v2 como línea vigente
  contracts_tag: "v3-contracts-frozen-1.0.0"

