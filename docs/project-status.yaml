# avanzar sin que VM105 cambie. Los tres bloques de abajo lo hacen explícito;
# no los mezcles al leer o escribir aquí.
#
# Actualizado tras el cierre de los programas de calidad V3 (Puertas 4 y 6),
# la medición del acuerdo determinista∧NVIDIA y los bloques M0/M2/M3/M4/M5a
# del programa multi-partida (2026-08-06).

