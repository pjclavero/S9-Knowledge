# project-status.yaml — estado estructurado de S9 Knowledge (fuente de coherencia)
#
# Fuente de verdad: main + tags + PRs mergeados + CI de GitHub Actions para el
# bloque `development`; manifest de la release activa + estado verificado por
# SSH en VM105 para el bloque `production`. NO contiene secretos, IP privadas
# innecesarias, tokens ni hashes. Es la referencia para
# scripts/check_docs_consistency.py.
#
# El repositorio (`main`) y la producción desplegada (VM105) van
# DESACOPLADOS desde el merge de V3 (PR #110, 2026-07-29): `main` puede
# avanzar sin que VM105 cambie. Los tres bloques de abajo lo hacen explícito;
# no los mezcles al leer o escribir aquí.
#
# Actualizado tras el cierre del carril A (Graph UX V2, PR #158) y del disparo
# de CI en toda rama (PR #160) — 2026-08-11.
#
# `main_commit` y `latest_merged_pr` NO se escriben de memoria:
# scripts/check_docs_consistency.py los contrasta contra `origin/main` y falla
# si divergen. Editarlos a mano y equivocarse pone el gate en rojo.
#
# ============================================================================
# QUE SIGNIFICAN EXACTAMENTE `main_commit` Y `latest_ci` (LEER ANTES DE TOCAR)
# ============================================================================
#
#   main_commit  = ultimo commit YA VERIFICADO desde el que se genero esta
#                  fotografia
#   latest_ci    = resultado de CI DE main_commit
#
#   NO son  = el SHA ni el CI del commit que contiene este fichero.
#
# POR QUE NO PUEDEN SERLO. No es una convencion ni una comodidad: es
# IMPOSIBLE POR CONSTRUCCION. El hash de un commit de git se calcula sobre su
# contenido, y este fichero forma parte de ese contenido. Escribir aqui el SHA
# del commit que va a contener este fichero exigiria conocer el hash antes de
# calcularlo: una autorreferencia que git no admite. Lo mismo, y con mas
# motivo, para `latest_ci`: el resultado de CI de un commit no existe hasta
# despues de crearlo y ejecutarlo.
#
# CONSECUENCIA, y hay que decirla entera: **el desfase de al menos un commit
# es ESTRUCTURAL**. Cualquier refresco de este fichero describe, como maximo,
# a su commit PADRE. Actualizar el campo «un commit mas» no cierra la brecha:
# solo desplaza la contradiccion al commit siguiente. Por eso este fichero
# **NO volvera a actualizarse para nombrarse a si mismo**, y un desfase de uno
# o pocos commits NO es un defecto que haya que perseguir.
#
# QUE SI ES UN DEFECTO, y sigue siendo rojo: que `main_commit` no exista, que
# no sea ANCESTRO de `origin/main` (es decir, que describa una rama que no es
# `main`), que `latest_merged_pr` no aparezca en la historia de `main`, o que
# `latest_ci` contradiga la CI real de `main_commit` cuando hay oraculo con el
# que contrastarla (`S9K_CI_ORACLE`, ver scripts/check_docs_consistency.py).
# La propiedad verdadera es ANCESTRIA + VERIFICACION, nunca autorreferencia.
#
# QUIEN ATA UNA RELEASE A UN SHA EXACTO. Este fichero **no** es el documento
# que congela `BASE RC V3.1` ni ninguna otra release: eso lo hace el **acta
# externa del RC**, que se escribe DESPUES del commit y por tanto si puede
# nombrarlo sin contradiccion. Este fichero es una FOTOGRAFIA DE ESTADO con su
# fecha y su commit de medida; el acta del RC es el documento de congelacion.
# Si alguien, dentro de un ano, busca aqui «el SHA de la RC», esta en el sitio
# equivocado: el dato vive en el acta, y aqui solo vive «desde donde se
# midio».
#
# NO SE HAN RENOMBRADO a `verified_commit` / `verified_ci` a proposito: los
# nombres actuales tienen consumidores en scripts/check_docs_consistency.py,
# en deploy/tests/test_docs_consistency.py (decenas de llamadas) y en el
# historico del CHANGELOG, y un renombrado con un solo consumidor colgando es
# peor que ninguno. Se corrige la SEMANTICA, que era lo que estaba mal, no la
# etiqueta.
# ============================================================================
#
# CONVENCIÓN DE PROCEDENCIA. Cada dato de `production` declara cómo se sabe:
#   VERIFIED             — leído directamente en el destino, con fecha.
#   PENDING_VERIFICATION — conocido en el pasado y NO releído desde entonces.
# Un dato PENDING_VERIFICATION no es falso ni verdadero: es NO COMPROBADO, y
# ningún documento debe citarlo como estado actual. El recuerdo de una
# conversación no es verificación.

development:
  # Lo que hay en `main` ahora mismo. NO implica que esté desplegado.
  #
  # REMEDIDO el 2026-08-13 contra `origin/main`, no contra el worktree:
  #   `git rev-parse origin/main`                       -> 37accbaca201…
  #   `gh pr list --state merged` ordenado por `mergedAt` -> #178
  #
  # Y otra vez el aviso de esta línea se cumple: **el #171 se fusionó DESPUÉS
  # que el #173** (09:46 frente a 09:33 UTC). El último NO es el de número
  # mayor; se determina por FECHA DE FUSIÓN, nunca ordenando números.
  #
  # Desde el refresco anterior (#168) entraron: #172, #173, #167, #171, #166,
  # #170, #174, #175, #176, #177 y #178 — el bloque de transición
  # post-hardening (P0 `admin_full`, saturación del grafo, parcialidad del
  # visor, inventario) y el carril C (Review Console).
  #
  # REMEDIDO el 2026-09-04 contra `origin/main`, no contra el worktree:
  #   `git rev-parse origin/main`  -> 4fea1f2075933a244ce1acea31289d393e5ad81e
  #   `gh pr list --state merged` ordenado por `mergedAt` -> #197 (03:26:50Z)
  #
  # Y una vez más el aviso de esta línea se cumple: el último por FECHA no es
  # el de número mayor. Entraron, en este orden real de fusión: #203, #196,
  # #198, #200, #199 y #197 — la cadena de hardening V3.1 (excepción acotada
  # de `nltk`, parcialidad por valor, CSRF, excepciones por tipo/código,
  # anti-desaparición de suites y métodos de escritura). El #197 es el último
  # pese a llevar el número más bajo de los tres finales.
  #
  # REMEDIDO el 2026-09-05 contra `origin/main`, no contra el worktree, y leyendo
  # la semántica de arriba: esto es EL COMMIT YA VERIFICADO desde el que se toma
  # la fotografía, no el commit que contiene este fichero.
  #   `git rev-parse origin/main`  -> 84f9cc7596381e1e56ff5a2fc059104b3c5aa063
  #   `gh pr list --state merged` ordenado por `mergedAt` -> #204 (22:40:32Z)
  #
  # Y el aviso de esta línea se cumple una vez más, con el ejemplo más claro
  # hasta ahora: el **#205** se fusionó a las 05:09:05Z del 2026-09-04 y el
  # **#204** a las 22:40:32Z del MISMO día. El último por FECHA es el #204
  # pese a llevar el número MENOR. Ordenar por número habría escrito #205.
  main_commit: "84f9cc7596381e1e56ff5a2fc059104b3c5aa063"
  latest_merged_pr: 204  # por fecha de fusión: el #204 entró DESPUÉS que el #205
  # CI DE `main_commit` (84f9cc7), no de este commit — ver la explicación de
  # semántica en la cabecera de este fichero.
  #
  # MEDIDO el 2026-09-05, contando EJECUCIONES y no identidades únicas:
  #   gh api repos/pjclavero/S9-Knowledge/commits/84f9cc7.../check-runs
  # En `main` sólo corre el evento `push`, así que 17 identidades = 17
  # ejecuciones (en un PR serían 34, porque corren `push` y `pull_request`).
  # Resultado: 17/17 SUCCESS, 0 pendientes. Se escribe "green" porque se ha
  # medido, no porque convenga: la entrada anterior decía "red" y también
  # estaba medida.
  latest_ci: "green"

  # Cuántos jobs CORREN frente a cuántos BLOQUEAN un merge. La diferencia se
  # escribe a propósito: un job que corre pero no se exige no impide fusionar
  # en rojo. Es un informe, no una puerta. Ver RK-20.
  # Se deja el LITERAL a propósito, no una cuenta derivada de los workflows:
  # derivarla la haría siempre cierta y la fila C13 («ponerlo a 99 enrojece»)
  # dejaría de poder ponerse roja. Una cifra que no puede fallar no comprueba
  # nada. El precio es refrescarla a mano, y le toca a quien añade o quita un
  # job, en el mismo commit que lo hace.
  #
  # MEDIDO el 2026-08-13 sobre `main@37accba`, contando los `name:` de
  # `.github/workflows/*.y*ml`: `ci.yml` 14 + `supply-chain.yml` 1 = **15**.
  # Sin cambio respecto al refresco anterior: los 11 PR fusionados desde
  # entonces no añaden ni quitan ningún job.
  #
  # REFRESCADO al cablear el censo de rutas como puerta (carril «censo de rutas
  # como puerta», docs/82). Medido con `yaml.safe_load`, no con un grep:
  # `ci.yml` 15 + `supply-chain.yml` 1 = **16**. El job nuevo es
  # `route-map-gate` / «Censo de rutas (configuracion canonica en codigo)».
  # ACTUALIZADO por el carril «métodos de escritura» (docs/84): entra el job
  # `metodos-de-escritura`, que CORRE pero todavía NO bloquea. 16 + 1 = **17**,
  # y la aritmética es **17 − 1 = 16** (ver la corrección de `ci_checks_required`
  # justo debajo: la versión anterior decía «17 − 2 = 15» sobre una premisa
  # caducada, y este PR la rederivó sin comprobarla contra la API).
  ci_jobs_running: 17
  #
  # CORREGIDO el 2026-08-19 contra la FUENTE, no contra esta misma terna:
  # `gh api repos/pjclavero/S9-Knowledge/branches/main/protection
  #  --jq '.required_status_checks.contexts[]'` devuelve **16** contextos, no 15.
  # El decimosexto es «Censo de rutas (configuracion canonica en codigo)», que
  # se promovió a exigido y este fichero no se refrescó: lo declaraba NO exigido
  # mientras BLOQUEABA merges.
  #
  # POR QUÉ NO SALTÓ NADA, que es lo grave: `check_docs_consistency.py` sólo
  # comprueba `ci_jobs_running − len(ci_running_but_not_required) ==
  # ci_checks_required` y **nunca consulta la protección de rama**. Dos entradas
  # equivocadas se cancelaban en una terna internamente consistente: una cifra
  # comparada CONSIGO MISMA, que es exactamente el defecto que persigue el
  # carril de docs/84 —el censo comparaba el decorador consigo mismo— aparecido
  # aquí, en el fichero de estado. Se corrigen las dos entradas; **cruzar el
  # gate contra `.../protection` en vez de contra sí mismo queda como DEUDA
  # declarada**, y es otro carril: mientras no se haga, esta terna sigue siendo
  # verificable sólo a mano.
  # PROMOVIDO el 2026-09-04, al fusionarse el carril 2 de V3.1 (#197): el rojo a
  # propósito de `metodos-de-escritura` quedó cerrado y el job pasó a EXIGIDO.
  # Leído de la FUENTE, no de esta terna, antes y después del cambio:
  #   `gh api .../branches/main/protection/required_status_checks`
  #      antes  -> 16 contextos
  #      después -> 17 contextos
  # Verificado por DIFERENCIA DE CONJUNTOS, no por el recuento: perdidos = 0,
  # añadidos = {"Metodos de escritura (especificacion independiente del
  # montaje)"}. El `PATCH` de ese endpoint es REEMPLAZO TOTAL: contar 17 no
  # demuestra que no se haya caído otro por el camino, y ya ocurrió una vez.
  ci_checks_required: 17
  #
  # El validador comprueba `ci_jobs_running − len(lista) == ci_checks_required`,
  # así que la lista es lo que sostiene la aritmética: ahora 17 − 0 = 17. Si
  # mañana aparece otro job que corre sin bloquear, tiene que anotarse aquí o la
  # cuenta se pone roja. El nombre que va aquí es el `name:` del job, que es lo
  # que compara `check_docs_consistency.py`.
  #
  # La lista queda VACÍA: todo job que corre, bloquea. Sigue viva la DEUDA
  # declarada arriba —este gate compara la terna consigo misma y NO consulta
  # `.../protection`—, así que la coincidencia de esta línea con la realidad
  # sigue siendo verificable sólo a mano.
  ci_running_but_not_required: []

  # UMBRAL DE AVISO del desfase. NO es un umbral de error (rediseñado el
  # 2026-08-13): a partir de aquí el gate ANUNCIA cuántos commits han entrado
  # desde `main_commit`, y califica su titular con `(DESFASADA: …)`, pero NO se
  # pone rojo.
  #
  # Por qué dejó de ser error: este campo documenta EL COMMIT SOBRE EL QUE SE
  # MIDIERON las cifras. Envejecer no lo vuelve falso — que se hayan fusionado
  # commits detrás no demuestra ninguna contradicción, sólo demuestra que hubo
  # merges. Tratarlo como error hacía la puerta INSOSTENIBLE POR CONSTRUCCIÓN:
  # cada merge invalidaba el refresco anterior, y con PRs de 10+ commits el
  # refresco caducaba EN EL MOMENTO DE FUSIONARSE. Medido el 2026-08-13: al
  # fusionar el #168 quedó 9 commits atrás; el carril M lo refrescó a `e752dbe`
  # y su propio merge (#167) lo desfasó otra vez. `main` pasó casi toda la
  # sesión en rojo bloqueando A LA VEZ todas las ramas abiertas, y mantenerlo
  # verde exigía encadenar refrescos manuales a perpetuidad. Eso no es un gate:
  # es mantenimiento perpetuo que además bloquea a terceros.
  #
  # Subir este número NUNCA fue el arreglo, y ahora además no compra nada.
  #
  # LO QUE SIGUE SIENDO ROJO (y está calibrado en C21c, con el bloque
  # deliberadamente desfasado, para que conste que cambió el criterio y no la
  # capacidad de detectar):
  #   - `main_commit` que no existe, que no es ancestro de `main`, o que no es
  #     un SHA de 40 hex;
  #   - `latest_merged_pr` que NO está en la historia de `main`;
  #   - contadores de CI que no cuadran con `.github/workflows/`;
  #   - documentos y YAML que se contradicen;
  #   - valores declarados que NO se han podido comprobar (historia truncada).
  #
  # Refrescar `main_commit` sigue siendo buena higiene —y el AVISO lo recuerda—,
  # pero ya no bloquea a nadie:
  #   git rev-list --count <main_commit>..origin/main
  max_lag_commits: 3
