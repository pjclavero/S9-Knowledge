---
# Defaults del rol systemd.

s9k_root: /opt/s9-knowledge
s9k_config_root: /etc/s9-knowledge
s9k_viewer_service: s9-knowledge-viewer.service
s9k_providers_env: "{{ s9k_config_root }}/providers.env"
s9k_service_user: www-data
s9k_service_group: www-data
s9k_restore_test_enabled: false
s9k_restore_test_timer: weekly
s9k_restore_max_age_days: 8
s9k_neo4j_backup_root: /opt/knowledge-services/backups
