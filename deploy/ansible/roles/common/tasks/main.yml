---
# Rol common — paquetes de sistema y estructura de directorios base.
# Idempotente. Sin secretos.

- name: Instalar paquetes de sistema requeridos
  ansible.builtin.package:
    name: "{{ s9k_system_packages }}"
    state: present
  tags:
    - common
    - packages

# H-06 + H-08: la identidad de servicio es de SISTEMA (sin login, sin home, sin
# sudo) y se crea ANTES que cualquier directorio que le pertenezca. Idempotente.
- name: Comprobar que la identidad de servicio viene de group_vars/all.yml
  ansible.builtin.assert:
    that:
      - s9k_service_user is defined
      - s9k_service_group is defined
      - s9k_service_user != 'root'
    fail_msg: >-
      s9k_service_user/s9k_service_group no estan definidos (o es root).
      Se definen UNA vez en group_vars/all.yml; no en el inventario ni en roles.
  tags:
    - common
    - service_user

- name: Crear el grupo de sistema del servicio
  ansible.builtin.group:
    name: "{{ s9k_service_group }}"
    system: true
    state: present
  tags:
    - common
    - service_user

- name: Crear el usuario de sistema del servicio (sin login, sin home, sin sudo)
  ansible.builtin.user:
    name: "{{ s9k_service_user }}"
    group: "{{ s9k_service_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    home: /nonexistent
    comment: "S9 Knowledge service"
    state: present
  tags:
    - common
    - service_user

- name: Crear directorio raíz del despliegue
  ansible.builtin.file:
    path: "{{ s9k_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - common
    - directories

- name: Crear directorio de releases
  ansible.builtin.file:
    path: "{{ s9k_root }}/releases"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - common
    - directories

- name: Crear directorio de estado mutable
  ansible.builtin.file:
    path: "{{ s9k_state_root }}"
    state: directory
    owner: "{{ s9k_service_user }}"
    group: "{{ s9k_service_group }}"
    mode: "0700"
  tags:
    - common
    - directories

- name: Crear subdirectorios de estado mutable
  ansible.builtin.file:
    path: "{{ s9k_state_root }}/{{ item }}"
    state: directory
    owner: "{{ s9k_service_user }}"
    group: "{{ s9k_service_group }}"
    mode: "0700"
  loop:
    - auth
    - jobs
    - state
    - output
    - staging
    - backups
    # B2 (USABLE-V1) · H-04, lado deploy: el estado de revision V3 vive FUERA
    # de la release. Mismas rutas que `deploy/config/viewer.env.example`
    # (S9K_V3_REVIEW_DATABASE_PATH / S9K_V3_REVIEW_PROPOSALS_DIR); el testigo
    # de B2 cruza esta lista contra la plantilla.
    - reviews-v3
    - reviews-v3/proposals
    # H-06: el informe de salud (S9K_HEALTH_REPORT_PATH) vive aqui y lo escribe
    # el healthcheck como s9knowledge; antes no lo creaba nadie.
    - health
  tags:
    - common
    - directories

- name: Crear directorio de configuracion y secretos
  ansible.builtin.file:
    path: "{{ s9k_config_root }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags:
    - common
    - directories

- name: Crear directorio de logs
  ansible.builtin.file:
    path: "{{ s9k_log_root }}"
    state: directory
    owner: "{{ s9k_service_user }}"
    group: "{{ s9k_service_group }}"
    mode: "0750"
  tags:
    - common
    - directories

- name: Verificar si deploy.env existe (solo comprobacion, no lo crea)
  ansible.builtin.stat:
    path: "{{ s9k_config_root }}/deploy.env"
  register: _deploy_env_stat
  changed_when: false
  tags:
    - common
    - config

- name: Advertir si deploy.env no existe
  ansible.builtin.debug:
    msg: >-
      AVISO: {{ s9k_config_root }}/deploy.env no encontrado. Es OPCIONAL:
      sin S9K_REPO_URL, la PRIMERA release (deploy.sh --mode fresh) se clona
      de {{ s9k_root }}/.repo-cache, que prepara el rol data_engine.
      Ver deploy/README.md, «Primera release».
  when: not _deploy_env_stat.stat.exists
  tags:
    - common
    - config
