---
# Variables globales para todos los hosts del grupo s9knowledge.
# SIN secretos. Los secretos van en EnvironmentFiles del host (no versionados).
# Copiar inventory.example -> inventory.ini y ajustar valores.

# ---------------------------------------------------------------------------
# Rutas principales (deben coincidir con deploy/scripts/lib.sh)
# ---------------------------------------------------------------------------
s9k_root: /opt/s9-knowledge
s9k_state_root: /var/lib/s9-knowledge
s9k_config_root: /etc/s9-knowledge
s9k_log_root: /var/log/s9-knowledge

# URL del repositorio (sin credenciales; usar deploy keys o HTTPS público)
s9k_repo: https://github.com/pjclavero/S9-Knowledge.git
s9k_branch: main

# Release a activar (se sobreescribe en la línea de comandos con -e)
s9k_release_id: ""

# ---------------------------------------------------------------------------
# Servicio systemd
# ---------------------------------------------------------------------------
s9k_viewer_service: s9-knowledge-viewer.service
s9k_viewer_port: 8088
s9k_service_user: www-data
s9k_service_group: www-data

# ---------------------------------------------------------------------------
# Paquetes de sistema requeridos
# ---------------------------------------------------------------------------
s9k_system_packages:
  - git
  - python3
  - python3-venv
  - python3-pip
  - curl
  - jq

# ---------------------------------------------------------------------------
# Auth (deshabilitada por defecto; habilitar en inventory.ini si se necesita)
# ---------------------------------------------------------------------------
s9k_auth_enabled: false

# ---------------------------------------------------------------------------
# Vía HTTPS (PR-3, USABLE-V1). Sin HTTPS no se puede crear el primer
# administrador: la cookie CSRF de /setup/admin sale `Secure` y sobre HTTP
# plano el POST entra en bucle de 403. Ver deploy/README.md §Vía HTTPS.
#
# Vacío a propósito: el rol `tls` no inventa un nombre público. Declararlo en
# inventory.ini junto con el certificado.
# ---------------------------------------------------------------------------
s9k_public_host: ""
s9k_tls_provision: false
s9k_tls_cert_file: ""
s9k_tls_key_file: ""
s9k_tls_ca_file: ""
# s9k_environment: SIN DEFAULT A PROPOSITO (observacion O1 del PR #266).
# Declararlo explicitamente en inventory.ini como `lab` o `production`; el
# rol `tls` lo exige con un `assert` y falla si falta o si no es uno de esos
# dos valores (fail-closed, igual que `deploy.sh --environment`).

# ---------------------------------------------------------------------------
# Healthchecks (timer deshabilitado por defecto hasta validación en lab)
# ---------------------------------------------------------------------------
s9k_healthcheck_timer_enabled: false
s9k_restore_test_enabled: false
s9k_restore_test_timer: weekly
s9k_restore_max_age_days: 8
s9k_neo4j_backup_root: /opt/knowledge-services/backups
